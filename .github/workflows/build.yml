name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: aircard-macos-arm64
          - os: macos-15-intel
            artifact: aircard-macos-x86_64
          - os: windows-latest
            artifact: aircard-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Offline unit tests (no iPhone required)
        run: cargo test --locked
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh
          ./dist/AirCard.app/Contents/MacOS/aircard --check-runtime
          ditto -c -k --sequesterRsrc --keepParent dist/AirCard.app dist/AirCard.zip
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/AirCard.zip
            target/release/aircard.exe
          if-no-files-found: error
